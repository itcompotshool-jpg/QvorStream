<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>QVORSTREAM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e8183a; --ra:rgba(232,24,58,.13); --rb:rgba(232,24,58,.35);
  --bg:#09090c; --s1:#111116; --s2:#18181e; --s3:#20202a;
  --bd:rgba(255,255,255,.07); --bd2:rgba(255,255,255,.12);
  --tx:#f0f0f5; --tx2:#888898; --tx3:#4e4e62;
  --green:#22c55e;
  --fn:'Nunito',sans-serif; --fd:'Bebas Neue',sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;height:100dvh;background:var(--bg);color:var(--tx);font-family:var(--fn);overflow:hidden;position:fixed;width:100%}
button,input,select{font-family:var(--fn);border:none;outline:none;background:none}
img{display:block;object-fit:cover}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px}

/* GLASS MORPHISM */
.glass{background:rgba(24,24,30,.45);backdrop-filter:blur(12px) brightness(1.1);border:1px solid rgba(255,255,255,.08);box-shadow:0 8px 32px rgba(0,0,0,.3)}

/* SCREENS */
#s-menu{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:16px}
#s-app{position:fixed;inset:0;z-index:100;display:none}
#s-app.on{display:flex}

/* MENU */
.menu-card{
  position:relative;z-index:1;width:100%;max-width:400px;
  background:linear-gradient(160deg,var(--s2),var(--s1));
  border:1px solid var(--bd2);border-radius:22px;
  padding:26px 22px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
  display:flex;flex-direction:column;gap:18px;
}
.hero h1{font-family:var(--fd);font-size:clamp(1.7rem,5vw,2.4rem);letter-spacing:.1em}
.hero p{font-size:12px;color:var(--tx3);margin-top:3px;letter-spacing:.05em}
.fl{display:flex;flex-direction:column;gap:5px}
.fl-lbl{font-size:10px;font-weight:800;letter-spacing:.18em;color:var(--tx3);text-transform:uppercase}
.fl-inp{background:var(--s3);border:1.5px solid var(--bd2);border-radius:11px;color:var(--tx);padding:11px 13px;font-size:14px;font-weight:700}
.btn-r{padding:13px;border-radius:11px;background:linear-gradient(135deg,#ff2a4a,#bf0f2d);color:#fff;font-size:13px;font-weight:800;letter-spacing:.07em;cursor:pointer;text-align:center}

/* APP LAYOUT */
#s-app.on{flex-direction:row}
.pcol{position:relative;flex:1;background:#000;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.ccol{width:320px;flex-shrink:0;display:flex;flex-direction:column;background:var(--s1);border-left:1px solid var(--bd)}

/* PLAYER & CONTROLS */
#pw{flex:1;position:relative;background:#000;overflow:hidden}
#vm{position:absolute;inset:0}
#vm iframe,#vm video{width:100%;height:100%;border:none;display:block}
#ptop{position:absolute;top:0;left:0;right:0;z-index:20;padding:10px 12px;display:flex;align-items:center;gap:7px;background:linear-gradient(to bottom,rgba(0,0,0,.82),transparent);pointer-events:none}
#ptop>*{pointer-events:all}
.pp-pill{border-radius:20px;padding:4px 10px;font-size:11px;font-weight:700;backdrop-filter:blur(8px);background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.15);color:#fff}
.host-input-wrap{display:none;align-items:center;gap:5px;background:var(--s2);padding:4px 8px;border-radius:12px;border:1px solid var(--bd2)}
.host-input-wrap input{font-size:11px;color:#fff;width:150px}

/* CHAT */
#ccnt{flex:1;display:flex;flex-direction:column;min-height:0}
#cmsg{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
#cinp-row{display:flex;gap:6px;padding:10px;background:var(--s2);border-top:1px solid var(--bd)}
#msg-inp{flex:1;background:var(--s3);border:1px solid var(--bd);border-radius:8px;padding:8px 11px;color:var(--tx);font-size:13px;height:38px;resize:none}

/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:10px 16px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}

@media(max-width:700px){
  #s-app.on{flex-direction:column}
  .pcol{height:40%;flex:none}
  .ccol{width:100%;flex:1}
}
</style>
</head>
<body>

<div id="s-menu">
  <div class="menu-card">
    <div class="hero">
      <h1>QVORSTREAM</h1>
      <p>СОВМЕСТНЫЙ ПРОСМОТР</p>
    </div>
    <div class="fl">
      <label class="fl-lbl">Ваше имя</label>
      <input class="fl-inp" id="mn" placeholder="Введите имя..." maxlength="20">
    </div>
    <div id="menu-main">
      <div class="btn-r" onclick="initRoom(true)" style="margin-bottom:10px">СОЗДАТЬ КОМНАТУ</div>
      <div class="fl">
        <input class="fl-inp" id="jr-code" placeholder="Код комнаты..." maxlength="6" style="text-transform:uppercase">
      </div>
      <div class="btn-r" onclick="initRoom(false)" style="margin-top:10px">ПРИСОЕДИНИТЬСЯ</div>
    </div>
  </div>
</div>

<div id="s-app">
  <div class="pcol">
    <div id="pw">
      <div id="vm"></div>
      <div id="ptop">
        <div class="pp-pill">📍 <span id="room-code">...</span></div>
        <div class="host-input-wrap" id="host-ctrl">
          <input type="text" id="v-url" placeholder="YouTube, VK, MP4 ссылка...">
          <button onclick="changeVideo()" class="btn-r" style="padding:4px 8px; font-size:10px">OK</button>
        </div>
        <div style="flex:1"></div>
        <div class="pp-pill" id="c-views">1 зритель</div>
      </div>
    </div>
  </div>
  
  <div class="ccol">
    <div id="ccnt">
      <div id="cmsg"></div>
      <div id="cinp-row">
        <textarea id="msg-inp" placeholder="Сообщение..."></textarea>
        <button onclick="sendMsg()" class="btn-r" style="padding:0 15px">⏎</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// STATE
let user = { name: 'Аноним', ava: 'https://i.pravatar.cc/100' };
let curCode = '', isHost = false, wsOK = false, vidEl = null;
const WS_URL = location.protocol.replace('http','ws')+'//'+location.host;

function $(id) { return document.getElementById(id); }
function toast(m) { $('toast').textContent = m; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'), 3000); }

// INIT
function initRoom(host) {
  const nm = $('mn').value.trim();
  if(!nm) return toast('Введите имя');
  user.name = nm;
  isHost = host;
  curCode = host ? Math.random().toString(36).substr(2,6).toUpperCase() : $('jr-code').value.toUpperCase();
  if(!host && curCode.length < 6) return toast('Введите код');

  $('s-menu').style.display = 'none';
  $('s-app').classList.add('on');
  $('room-code').textContent = curCode;
  if(isHost) $('host-ctrl').style.display = 'flex';
  
  connectWS();
}

// WEBSOCKET
function connectWS() {
  const ws = new WebSocket(WS_URL);
  ws.onopen = () => { wsOK = true; send({type:'join', code:curCode, name:user.name, isHost}); };
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if(msg.type === 'chat') addChat(msg.name, msg.text);
    if(msg.type === 'video') loadVideo(msg.url);
  };
  window._ws = ws;
}

function send(obj) { if(wsOK) window._ws.send(JSON.stringify(obj)); }

// VIDEO LOGIC (VK + YOUTUBE)
function changeVideo() {
  const url = $('v-url').value.trim();
  if(url) { send({type:'video', url}); loadVideo(url); }
}

function loadVideo(url) {
  const vm = $('vm');
  vm.innerHTML = '';
  
  if (url.includes('youtube.com') || url.includes('youtu.be')) {
    let vid = url.match(/(?:v=|be\/|embed\/)([^&?\s]+)/)?.[1];
    vm.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1" allow="autoplay;fullscreen"></iframe>`;
  } 
  else if (url.includes('vk.com/video') || url.includes('vkvideo.ru')) {
    // Парсинг ID видео из ссылки VK
    let match = url.match(/video(-?[0-9]+_[0-9]+)/);
    if (match) {
      let parts = match[1].split('_');
      vm.innerHTML = `<iframe src="https://vk.com/video_ext.php?oid=${parts[0]}&id=${parts[1]}&hash=0" allow="autoplay;fullscreen"></iframe>`;
    }
  } 
  else {
    vm.innerHTML = `<video id="vv" controls autoplay style="width:100%; height:100%"><source src="${url}" type="video/mp4"></video>`;
  }
}

// CHAT LOGIC
function sendMsg() {
  const t = $('msg-inp').value.trim();
  if(t) { send({type:'chat', text:t, name:user.name}); addChat(user.name, t); $('msg-inp').value = ''; }
}

function addChat(n, t) {
  const d = document.createElement('div');
  d.innerHTML = `<b style="font-size:12px; color:var(--red)">${n}:</b> <span style="font-size:13px">${t}</span>`;
  d.style.marginBottom = '5px';
  $('cmsg').appendChild(d);
  $('cmsg').scrollTop = $('cmsg').scrollHeight;
}
</script>
</body>
</html>
