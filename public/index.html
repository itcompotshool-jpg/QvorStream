<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>QVORSTREAM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e8183a; --ra:rgba(232,24,58,.13); --rb:rgba(232,24,58,.35);
  --bg:#09090c; --s1:#111116; --s2:#18181e; --s3:#20202a;
  --bd:rgba(255,255,255,.07); --bd2:rgba(255,255,255,.12);
  --tx:#f0f0f5; --tx2:#888898; --tx3:#4e4e62;
  --green:#22c55e;
  --fn:'Nunito',sans-serif; --fd:'Bebas Neue',sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  height: 100dvh;
  background: var(--bg);
  color: var(--tx);
  font-family: var(--fn);
  overflow: hidden;
  width: 100%;
  position: fixed;
}

body { display: flex; flex-direction: column; }

/* ═══ MAIN LAYOUT ═══ */
#app { display: none; flex: 1; }
#app.active { display: flex; }

#menu { 
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  padding: 20px;
}

#menu.hide { display: none; }

.menu-card {
  background: linear-gradient(160deg, var(--s2), var(--s1));
  border: 1px solid var(--bd2);
  border-radius: 22px;
  padding: 30px 25px;
  max-width: 400px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.menu-title { font-family: var(--fd); font-size: 2rem; letter-spacing: .1em; margin-bottom: 10px; }
.menu-text { font-size: 13px; color: var(--tx3); }

.input-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.input-label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--tx3); letter-spacing: .1em; }
.input-field {
  background: var(--s3);
  border: 1.5px solid var(--bd2);
  border-radius: 11px;
  color: var(--tx);
  padding: 12px 14px;
  font-size: 14px;
  font-weight: 700;
  transition: border-color .2s;
}
.input-field:focus { border-color: var(--rb); outline: none; box-shadow: 0 0 0 3px var(--ra); }

.btn {
  padding: 14px;
  border-radius: 11px;
  border: none;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  transition: all .2s;
  letter-spacing: .07em;
}

.btn-primary {
  background: linear-gradient(135deg, #ff2a4a, #bf0f2d);
  color: #fff;
  width: 100%;
  box-shadow: 0 4px 16px var(--ra);
}

.btn-primary:hover { transform: translateY(-2px); }

/* ═══ APP LAYOUT ═══ */
#app { flex-direction: row; }

#player {
  flex: 1;
  background: #000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
  position: relative;
}

#video-container {
  flex: 1;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#video-container video,
#video-container iframe {
  width: 100%;
  height: 100%;
  display: block;
  border: none;
  object-fit: contain;
}

.video-controls {
  background: rgba(0,0,0,.9);
  padding: 15px 20px;
  display: flex;
  gap: 15px;
  align-items: center;
  border-top: 1px solid var(--bd);
}

.progress-bar {
  flex: 1;
  height: 6px;
  background: rgba(255,255,255,.2);
  border-radius: 3px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  background: var(--red);
  width: 0%;
  border-radius: 3px;
}

.control-btn {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--s3);
  border: 1px solid var(--bd2);
  color: var(--tx2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all .2s;
  flex-shrink: 0;
}

.control-btn:hover { border-color: var(--rb); color: var(--red); }

.time-display {
  font-size: 12px;
  color: var(--tx3);
  min-width: 80px;
  font-weight: 700;
}

#chat {
  width: 320px;
  flex-shrink: 0;
  background: var(--s1);
  border-left: 1px solid var(--bd);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

#chat-input-box {
  padding: 12px;
  border-top: 1px solid var(--bd);
  background: var(--s1);
  flex-shrink: 0;
}

#chat-input {
  width: 100%;
  background: var(--s2);
  border: 1.5px solid var(--bd2);
  border-radius: 20px;
  color: var(--tx);
  padding: 10px 14px;
  font-size: 14px;
  font-weight: 600;
  transition: border-color .2s;
}

#chat-input:focus { border-color: var(--rb); outline: none; }

.message {
  display: flex;
  gap: 8px;
  padding: 8px;
  border-radius: 10px;
  max-width: 90%;
}

.message.mine {
  align-self: flex-end;
  flex-direction: row-reverse;
}

.message.theirs {
  align-self: flex-start;
}

.message-bubble {
  background: var(--s2);
  border-radius: 12px;
  padding: 8px 12px;
  word-break: break-word;
  font-size: 13px;
  line-height: 1.4;
}

.message.mine .message-bubble {
  background: var(--red);
  color: #fff;
  border-bottom-right-radius: 3px;
}

.message.theirs .message-bubble {
  background: var(--s3);
  border-bottom-left-radius: 3px;
}

.message-name {
  font-size: 11px;
  color: var(--tx3);
  font-weight: 800;
  margin-bottom: 2px;
}

.message-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  flex-shrink: 0;
  border: 1px solid var(--bd);
}

.connection-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #888;
  margin-right: 8px;
  flex-shrink: 0;
}

.connection-dot.connected { background: var(--green); }
.connection-dot.disconnected { background: #c41e3a; }

.room-info {
  padding: 12px;
  border-bottom: 1px solid var(--bd);
  font-size: 12px;
  color: var(--tx3);
}

.room-code {
  font-size: 16px;
  color: var(--red);
  font-weight: 800;
  letter-spacing: .1em;
  margin-top: 4px;
}

.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--s2);
  border: 1px solid var(--bd2);
  padding: 12px 24px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  transition: transform .3s;
  z-index: 1000;
  pointer-events: none;
  white-space: nowrap;
}

.toast.show { transform: translateX(-50%) translateY(0); }
.toast.error { border-color: var(--red); color: var(--red); }
.toast.success { border-color: var(--green); color: var(--green); }

@media(max-width:800px) {
  #app { flex-direction: column; }
  #player { height: 40%; }
  #chat { width: 100%; }
  .message { max-width: 95%; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--s3); border-radius: 2px; }

</style>
</head>
<body>

<!-- МЕНЮ -->
<div id="menu">
  <div class="menu-card">
    <h1 class="menu-title">Смотри вместе.</h1>
    <p class="menu-text">Синхронный просмотр видео с друзьями в реальном времени</p>
    
    <div id="login-form" style="display:none;">
      <div class="input-group">
        <label class="input-label">Твоё имя</label>
        <input type="text" id="username" class="input-field" placeholder="Аноним" maxlength="30">
      </div>
      
      <div id="join-section">
        <div class="input-group">
          <label class="input-label">Код комнаты</label>
          <input type="text" id="room-code" class="input-field" placeholder="1234" maxlength="4">
        </div>
        <button class="btn btn-primary" onclick="joinRoom()">Присоединиться</button>
      </div>
      
      <div style="text-align:center; font-size:12px; color:var(--tx3);">или</div>
      
      <button class="btn btn-primary" onclick="createRoom()" style="background: linear-gradient(135deg, #1e40af, #1e3a8a);">+ Создать комнату</button>
    </div>
    
    <div id="create-form" style="display:none;">
      <div class="input-group">
        <label class="input-label">Твоё имя</label>
        <input type="text" id="create-username" class="input-field" placeholder="Аноним" maxlength="30">
      </div>
      <div class="input-group">
        <label class="input-label">Ссылка на видео</label>
        <input type="text" id="video-url" class="input-field" placeholder="https://...">
      </div>
      <button class="btn btn-primary" onclick="doCreate()">Создать</button>
      <button class="btn" style="background:var(--s3);color:var(--tx2);" onclick="showLogin()">Назад</button>
    </div>
  </div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="app">
  <!-- ПЛЕЕР -->
  <div id="player">
    <div id="video-container"></div>
    <div class="video-controls">
      <button class="control-btn" onclick="rewind()">⏮</button>
      <button class="control-btn" onclick="togglePlay()" id="play-btn">▶</button>
      <button class="control-btn" onclick="forward()">⏭</button>
      <div class="progress-bar" id="progress" onclick="seek(event)">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
      <div class="time-display" id="time-display">0:00 / 0:00</div>
    </div>
  </div>
  
  <!-- ЧАТ -->
  <div id="chat">
    <div class="room-info">
      <div style="color:var(--tx3);">Комната</div>
      <div class="room-code" id="room-display">#—</div>
      <div style="color:var(--tx3); margin-top:8px; font-size:11px;">Участников: <span id="user-count">0</span></div>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-input-box">
      <input type="text" id="chat-input" placeholder="Сообщение..." onkeypress="handleChatInput(event)">
    </div>
  </div>
</div>

<!-- УВЕДОМЛЕНИЯ -->
<div id="toast" class="toast"></div>

<script>
'use strict';

// ═══ STATE ═══
let ws = null;
let wsConnected = false;
let currentRoom = null;
let currentUser = {
  id: Math.random().toString(36).slice(2),
  name: 'Аноним'
};
let isHost = false;
let videoUrl = '';
let videoEl = null;
let isPaused = true;

// ═══ INIT ═══
showLogin();

// ═══ UI EVENTS ═══
function showLogin() {
  document.getElementById('login-form').style.display = 'block';
  document.getElementById('create-form').style.display = 'none';
}

function createRoom() {
  document.getElementById('login-form').style.display = 'none';
  document.getElementById('create-form').style.display = 'block';
}

function doCreate() {
  const name = document.getElementById('create-username').value.trim() || 'Аноним';
  const url = document.getElementById('video-url').value.trim();
  
  if (!url) {
    toast('Введи ссылку на видео', 'error');
    return;
  }
  
  currentUser.name = name;
  videoUrl = url;
  isHost = true;
  
  connect(() => {
    send({ type: 'create_room', name: name, videoUrl: url });
  });
}

function joinRoom() {
  const name = document.getElementById('username').value.trim() || 'Аноним';
  const code = document.getElementById('room-code').value.trim();
  
  if (!code || code.length !== 4) {
    toast('Введи 4-значный код', 'error');
    return;
  }
  
  currentUser.name = name;
  currentRoom = code;
  isHost = false;
  
  connect(() => {
    send({ type: 'join_room', code: code, name: name });
  });
}

// ═══ WEBSOCKET ═══
function connect(callback) {
  if (wsConnected) return callback();
  
  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(protocol + '//' + location.host);
  
  ws.onopen = () => {
    wsConnected = true;
    updateConnectionStatus(true);
    if (callback) callback();
  };
  
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      handleMessage(msg);
    } catch (err) {
      console.error('Ошибка парсинга:', err);
    }
  };
  
  ws.onerror = () => {
    updateConnectionStatus(false);
    toast('Ошибка соединения', 'error');
  };
  
  ws.onclose = () => {
    wsConnected = false;
    updateConnectionStatus(false);
  };
}

function send(msg) {
  if (!wsConnected) {
    toast('Нет соединения', 'error');
    return;
  }
  ws.send(JSON.stringify(msg));
}

// ═══ MESSAGE HANDLER ═══
function handleMessage(msg) {
  console.log('← Получено:', msg.type, msg);
  
  switch(msg.type) {
    case 'room_created':
      currentRoom = msg.code;
      enterApp();
      toast('Комната создана: #' + msg.code, 'success');
      break;
    
    case 'room_joined':
      currentRoom = msg.code;
      if (msg.videoUrl) {
        videoUrl = msg.videoUrl;
        loadVideo(msg.videoUrl);
      }
      enterApp();
      toast('Вы присоединились к #' + msg.code, 'success');
      updateUserCount(msg.userCount || 1);
      break;
    
    case 'user_joined':
      addSystemMessage('→ ' + msg.name + ' присоединился');
      updateUserCount(msg.userCount);
      break;
    
    case 'user_left':
      addSystemMessage('← ' + msg.name + ' отключился');
      updateUserCount(msg.userCount);
      break;
    
    case 'video_changed':
      videoUrl = msg.url;
      loadVideo(msg.url);
      break;
    
    case 'video_sync':
      if (videoEl) {
        videoEl.currentTime = msg.time;
        if (msg.playing) videoEl.play();
        else videoEl.pause();
        isPaused = !msg.playing;
      }
      break;
    
    case 'chat':
      addChatMessage(msg.name, msg.text, msg.userId === currentUser.id);
      break;
  }
}

function updateConnectionStatus(connected) {
  const dot = document.querySelector('.connection-dot');
  if (dot) {
    if (connected) {
      dot.classList.add('connected');
      dot.classList.remove('disconnected');
    } else {
      dot.classList.remove('connected');
      dot.classList.add('disconnected');
    }
  }
}

// ═══ APP ═══
function enterApp() {
  document.getElementById('menu').classList.add('hide');
  document.getElementById('app').classList.add('active');
  document.getElementById('room-display').textContent = '#' + currentRoom;
}

function loadVideo(url) {
  const container = document.getElementById('video-container');
  container.innerHTML = '';
  
  if (url.includes('youtube.com') || url.includes('youtu.be') || url.includes('vk.com')) {
    // Embed
    let embedUrl = url;
    if (url.includes('vk.com/video')) {
      const match = url.match(/video(-?\d+)_(\d+)/);
      if (match) embedUrl = 'https://vk.com/video_ext.php?oid=' + match[1] + '&id=' + match[2];
    }
    container.innerHTML = '<iframe src="' + embedUrl + '" allow="autoplay;fullscreen" style="width:100%;height:100%;border:none;"></iframe>';
    videoEl = null;
  } else {
    // HTML5 video
    videoEl = document.createElement('video');
    videoEl.src = url;
    videoEl.controls = false;
    videoEl.addEventListener('timeupdate', updateProgress);
    videoEl.addEventListener('play', () => { isPaused = false; updatePlayBtn(); });
    videoEl.addEventListener('pause', () => { isPaused = true; updatePlayBtn(); });
    container.appendChild(videoEl);
  }
}

function togglePlay() {
  if (!videoEl) return;
  if (videoEl.paused) {
    videoEl.play();
  } else {
    videoEl.pause();
  }
  isPaused = videoEl.paused;
  updatePlayBtn();
  sendVideoSync();
}

function rewind() {
  if (!videoEl) return;
  videoEl.currentTime = Math.max(0, videoEl.currentTime - 10);
  sendVideoSync();
}

function forward() {
  if (!videoEl) return;
  videoEl.currentTime += 10;
  sendVideoSync();
}

function seek(e) {
  if (!videoEl) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  videoEl.currentTime = pct * (videoEl.duration || 0);
  sendVideoSync();
}

function updateProgress() {
  if (!videoEl) return;
  const pct = videoEl.duration ? (videoEl.currentTime / videoEl.duration) * 100 : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  
  const cur = formatTime(videoEl.currentTime);
  const dur = formatTime(videoEl.duration || 0);
  document.getElementById('time-display').textContent = cur + ' / ' + dur;
}

function updatePlayBtn() {
  document.getElementById('play-btn').textContent = isPaused ? '▶' : '⏸';
}

function formatTime(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
}

function sendVideoSync() {
  if (!videoEl) return;
  send({
    type: 'video_sync',
    time: videoEl.currentTime,
    playing: !videoEl.paused
  });
}

// ═══ CHAT ═══
function handleChatInput(e) {
  if (e.key !== 'Enter') return;
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  
  addChatMessage(currentUser.name, text, true);
  send({
    type: 'chat',
    text: text,
    name: currentUser.name,
    userId: currentUser.id
  });
  input.value = '';
}

function addChatMessage(name, text, isMine) {
  const msg = document.createElement('div');
  msg.className = 'message ' + (isMine ? 'mine' : 'theirs');
  
  let html = '<div class="message-bubble">';
  if (!isMine) html += '<div class="message-name">' + escapeHtml(name) + '</div>';
  html += '<div>' + escapeHtml(text) + '</div></div>';
  
  msg.innerHTML = html;
  document.getElementById('chat-messages').appendChild(msg);
  document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
}

function addSystemMessage(text) {
  const msg = document.createElement('div');
  msg.style.cssText = 'text-align:center;padding:6px;font-size:11px;color:var(--tx3);';
  msg.textContent = text;
  document.getElementById('chat-messages').appendChild(msg);
  document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
}

function updateUserCount(count) {
  document.getElementById('user-count').textContent = count;
}

// ═══ UTILS ═══
function toast(text, type = '') {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.className = 'toast show ' + type;
  setTimeout(() => { el.classList.remove('show'); }, 3000);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Auto-fill room code from URL
(function() {
  const params = new URLSearchParams(location.search);
  const code = params.get('join');
  if (code && /^\d{4}$/.test(code)) {
    document.getElementById('room-code').value = code;
  }
})();

</script>
</body>
</html>
