<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>QuorStream Pro | Ultra Edition</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #0071e3;
            --danger: #ff3b30;
            --bg: #000;
            --card: rgba(30, 30, 32, 0.75);
            --border: rgba(255, 255, 255, 0.1);
            --glass: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        /* Исправление высоты для мобилок */
        body, html { 
            margin: 0; padding: 0; 
            height: 100vh; height: 100dvh; 
            background: var(--bg); 
            color: #fff; font-family: 'SF Pro Display', sans-serif; 
            overflow: hidden; 
            position: fixed; width: 100%;
        }

        /* МЕНЮ ВХОДА */
        #screen-menu {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; background: radial-gradient(circle at 50% 50%, #1c1c1e 0%, #000 100%);
        }
        .auth-card {
            background: var(--card); backdrop-filter: blur(50px); border: 1px solid var(--border);
            padding: 30px; border-radius: 32px; width: 90%; max-width: 380px;
            display: flex; flex-direction: column; gap: 15px;
        }

        input {
            background: rgba(255,255,255,0.08); border: 1px solid var(--border);
            padding: 16px; border-radius: 18px; color: #fff; font-size: 16px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--accent); background: rgba(255,255,255,0.12); }
        
        .btn {
            background: var(--accent); color: #fff; border: none; padding: 16px;
            border-radius: 18px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn:active { transform: scale(0.96); }

        /* ПРИЛОЖЕНИЕ */
        #screen-app { 
            display: none; 
            height: 100%; 
            flex-direction: column; 
        }
        #screen-app.active { display: flex; }

        /* НАВИГАЦИЯ */
        .header-nav {
            padding: 10px 15px; 
            padding-top: max(10px, env(safe-area-inset-top));
            background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border);
            transition: all 0.4s ease;
            flex-shrink: 0;
        }
        .header-nav.hidden { margin-top: -100px; opacity: 0; pointer-events: none; }

        .url-box { flex: 1; position: relative; display: flex; align-items: center; }
        .url-box input { width: 100%; padding: 10px 40px 10px 12px; border-radius: 12px; font-size: 14px; }

        /* БОКОВАЯ ПАНЕЛЬ */
        #sidebar {
            position: fixed; left: -100%; top: 0; width: 100%; max-width: 300px; height: 100%;
            background: rgba(15, 15, 17, 0.98); backdrop-filter: blur(40px);
            z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-right: 1px solid var(--border); padding: 25px;
        }
        #sidebar.open { left: 0; }

        /* ГЛАВНАЯ СЕТКА */
        .main-grid { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
            padding: 10px; 
            gap: 10px; 
        }

        #player { 
            flex: 3; 
            background: #000; 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            overflow: hidden; 
            position: relative; 
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* ЧАТ */
        .chat-side { 
            flex: 1.2; 
            background: var(--card); 
            backdrop-filter: blur(30px); 
            border-radius: 20px; 
            border: 1px solid var(--border); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        #chat-scroll { 
            flex: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
        }
        .bubble { 
            background: var(--glass); 
            padding: 10px 14px; 
            border-radius: 18px; 
            max-width: 85%; 
            word-wrap: break-word;
            font-size: 14px;
        }
        .bubble.me { background: var(--accent); align-self: flex-end; }

        /* Ввод чата */
        .chat-input-area {
            padding: 10px;
            padding-bottom: max(10px, env(safe-area-inset-bottom));
            background: rgba(255,255,255,0.03);
            display: flex;
            gap: 8px;
            border-top: 1px solid var(--border);
        }

        /* Кнопка глаза */
        .visibility-toggle {
            position: fixed; bottom: 30px; right: 20px; z-index: 1001;
            width: 50px; height: 50px; background: var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        /* МОБИЛЬНАЯ АДАПТАЦИЯ */
        @media (max-width: 850px) {
            .main-grid { 
                flex-direction: column; 
                padding: 5px;
            }
            #player { 
                flex: none; 
                height: 30%; /* Плеер занимает 30% высоты */
                min-height: 200px;
            }
            .chat-side {
                flex: 1; /* Чат занимает все остальное пространство */
            }
            .header-nav.hidden { margin-top: -120px; } /* Полное скрытие на мобилках */
            .visibility-toggle { bottom: 20px; right: 20px; width: 45px; height: 45px; }
        }

        .btn-action { background: none; border: none; color: #fff; cursor: pointer; opacity: 0.7; }
    </style>
</head>
<body>

    <div id="vis-btn" class="visibility-toggle" onclick="toggleNav()" style="display:none;"><i data-lucide="eye"></i></div>

    <div id="sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin:0;">Комната</h2>
            <button onclick="toggleSidebar()" class="btn-action"><i data-lucide="x"></i></button>
        </div>
        <div style="margin-top:20px;">
            <div id="room-id-val-display" style="border: 1px dashed var(--accent); padding: 12px; border-radius: 15px; background: var(--glass); text-align: center; font-size: 18px; font-weight: bold; color: var(--accent); margin-bottom: 15px;">----</div>
            <button onclick="copyInviteLink()" class="btn" style="width:100%; font-size:14px;"><i data-lucide="link"></i> Ссылка</button>
        </div>
        <div style="margin-top:25px;">
            <p style="font-size:11px; opacity:0.5; text-transform:uppercase;">В сети</p>
            <div id="users-box" class="user-list"></div>
        </div>
    </div>

    <div id="screen-menu">
        <div class="auth-card">
            <h1 style="text-align:center; margin:0; font-size:28px;">QuorStream</h1>
            <input type="text" id="name-in" placeholder="Ваше имя">
            <input type="text" id="code-in" placeholder="Код комнаты (если есть)">
            <button class="btn" onclick="connect('create')"><i data-lucide="plus"></i> Создать</button>
            <button class="btn" style="background:#2c2c2e;" onclick="connect('join')"><i data-lucide="log-in"></i> Войти</button>
        </div>
    </div>

    <div id="screen-app">
        <div class="header-nav" id="main-nav">
            <button class="btn-action" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>
            <div class="url-box">
                <input type="text" id="url-input" placeholder="YouTube или VK...">
                <button onclick="setVideo()" style="position:absolute; right:10px; background:none; border:none; color:var(--accent);"><i data-lucide="play-circle"></i></button>
            </div>
            <button class="btn-action" onclick="location.reload()" style="color:var(--danger);"><i data-lucide="log-out"></i></button>
        </div>

        <div class="main-grid">
            <div id="player">
                <iframe id="video-frame" src="" allow="autoplay; fullscreen"></iframe>
            </div>
            <div class="chat-side">
                <div id="chat-scroll"></div>
                <div class="chat-input-area">
                    <input type="text" id="chat-msg" style="flex:1; padding:12px; border-radius:12px;" placeholder="Сообщение...">
                    <button class="btn" onclick="sendChat()" style="padding:10px 15px;"><i data-lucide="send" style="width:18px;"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
        const state = { ws: null, isHost: false, myId: null, roomCode: '' };

        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
        
        function toggleNav() {
            const nav = document.getElementById('main-nav');
            nav.classList.toggle('hidden');
            const isHidden = nav.classList.contains('hidden');
            document.getElementById('vis-btn').innerHTML = isHidden ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
            lucide.createIcons();
        }

        function copyInviteLink() {
            const link = `${window.location.origin}${window.location.pathname}?join=${state.roomCode}`;
            navigator.clipboard.writeText(link);
            alert("Ссылка скопирована!");
        }

        function parseUrl(url) {
            if (url.includes('youtube.com/watch') || url.includes('youtu.be/')) {
                let id = url.includes('youtu.be/') ? url.split('youtu.be/')[1].split(/[?#]/)[0] : new URLSearchParams(new URL(url).search).get('v');
                return `https://www.youtube.com/embed/${id}?autoplay=1`;
            }
            if (url.includes('vk.com/video')) {
                const m = url.match(/video(-?\d+)_(\d+)/);
                if (m) return `https://vk.com/video_ext.php?oid=${m[1]}&id=${m[2]}&hd=2&autoplay=1`;
            }
            return url;
        }

        function connect(type) {
            const name = document.getElementById('name-in').value || "Аноним";
            const code = document.getElementById('code-in').value;
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            
            // Заглушка для демонстрации, если сервер не подключен
            try {
                state.ws = new WebSocket(`${proto}//${window.location.host}`);
                state.ws.onopen = () => state.ws.send(JSON.stringify({ type, name, code }));
                state.ws.onmessage = (e) => {
                    const d = JSON.parse(e.data);
                    handleServerMessage(d);
                };
            } catch(e) {
                console.log("Ошибка подключения. Проверьте серверную часть.");
            }
        }

        function handleServerMessage(d) {
            if (d.type === 'room_created' || d.type === 'joined') {
                state.isHost = d.isHost || (d.type === 'room_created');
                state.myId = d.clientId;
                state.roomCode = d.code;
                document.getElementById('screen-menu').style.display = 'none';
                document.getElementById('screen-app').classList.add('active');
                document.getElementById('vis-btn').style.display = 'flex';
                document.getElementById('room-id-val-display').innerText = d.code;
                if (d.videoUrl) document.getElementById('video-frame').src = d.videoUrl;
            }
            if (d.type === 'set_video') document.getElementById('video-frame').src = d.url;
            if (d.type === 'chat') {
                const div = document.createElement('div');
                const me = d.clientId === state.myId;
                div.className = `bubble ${me ? 'me' : ''}`;
                div.innerHTML = `<span style="font-size:10px; opacity:0.6; display:block; margin-bottom:2px;">${me ? 'Вы' : d.sender}</span>${d.text}`;
                const scroll = document.getElementById('chat-scroll');
                scroll.appendChild(div);
                scroll.scrollTop = scroll.scrollHeight;
            }
        }

        function setVideo() {
            const val = document.getElementById('url-input').value;
            if (!val) return;
            const url = parseUrl(val);
            if (state.ws && state.ws.readyState === WebSocket.OPEN) {
                state.ws.send(JSON.stringify({ type: 'set_video', url }));
            }
            document.getElementById('video-frame').src = url;
            document.getElementById('url-input').value = "";
        }

        function sendChat() {
            const input = document.getElementById('chat-msg');
            const m = input.value;
            if (m && state.ws) {
                state.ws.send(JSON.stringify({ type: 'chat', text: m }));
                input.value = "";
            }
        }

        window.onload = () => {
            const params = new URLSearchParams(window.location.search);
            const joinCode = params.get('join');
            if (joinCode) document.getElementById('code-in').value = joinCode;
        };

        document.getElementById('chat-msg').onkeypress = (e) => { if(e.key === 'Enter') sendChat(); };
        document.getElementById('url-input').onkeypress = (e) => { if(e.key === 'Enter') setVideo(); };
    </script>
</body>
</html>
