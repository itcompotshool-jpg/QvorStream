<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>QVORSTREAM</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --red:#e8183a; --bg:#09090c; --s1:#111116; --s2:#18181e; --tx:#f0f0f5; 
  --fn:'Nunito',sans-serif; --fd:'Bebas Neue',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{height:100vh;background:var(--bg);color:var(--tx);font-family:var(--fn);overflow:hidden;width:100%}

/* --- ЭФФЕКТ СТЕКЛА --- */
.glass {
  background: rgba(255, 255, 255, 0.03) !important;
  backdrop-filter: blur(20px) saturate(160%) brightness(1.2);
  -webkit-backdrop-filter: blur(20px) saturate(160%) brightness(1.2);
  border: 1px solid rgba(255, 255, 255, 0.1) !important;
}

/* Экраны */
#s-menu { position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center; background:var(--bg); padding:20px; }
#s-app { position:fixed; inset:0; z-index:100; display:none; flex-direction:row; }
#s-app.on { display:flex; }

/* Меню */
.menu-card { width:100%; max-width:400px; background:var(--s1); border-radius:24px; padding:30px; border:1px solid rgba(255,255,255,0.05); text-align:center; }
.hero h1 { font-family:var(--fd); font-size:3rem; letter-spacing:3px; margin-bottom:20px; }
.fl-inp { background:var(--s2); border:1px solid rgba(255,255,255,0.1); border-radius:12px; color:#fff; padding:15px; width:100%; margin-bottom:10px; font-size:16px; }
.btn-r { background:var(--red); color:#fff; padding:15px; border-radius:12px; font-weight:800; cursor:pointer; width:100%; border:none; transition:0.2s; }
.btn-r:hover { opacity:0.9; }

/* Приложение */
.pcol { flex:1; position:relative; background:#000; }
.ccol { width:340px; background: rgba(10,10,15,0.7); backdrop-filter: blur(30px); border-left: 1px solid rgba(255,255,255,0.05); display:flex; flex-direction:column; }

#vm { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
#vm iframe, #vm video { width:100%; height:100%; border:none; }

/* Панель управления */
#ptop { 
  position:absolute; top:20px; left:20px; right:20px; z-index:100; 
  padding:10px; border-radius:18px; display:flex; align-items:center; gap:10px;
}
.pp-pill { background:rgba(0,0,0,0.5); padding:6px 15px; border-radius:20px; font-size:12px; font-weight:700; border:1px solid rgba(255,255,255,0.1); }
#url-wrap { display:none; align-items:center; gap:8px; }
#v-url { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:6px 12px; border-radius:10px; width:220px; font-size:12px; }

/* Чат */
#cmsg { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
.msg { background:rgba(255,255,255,0.05); padding:10px; border-radius:12px; font-size:14px; border:1px solid rgba(255,255,255,0.03); }
#cinp-row { margin:20px; padding:10px; border-radius:15px; display:flex; gap:10px; }
#msg-inp { flex:1; color:#fff; font-size:14px; height:24px; resize:none; background:transparent; border:none; outline:none; }

@media(max-width:700px){ #s-app.on{flex-direction:column} .pcol{height:40%} .ccol{width:100%;flex:1} }
</style>
</head>
<body>

<div id="s-menu">
  <div class="menu-card glass">
    <div class="hero"><h1>QVORSTREAM</h1></div>
    <input class="fl-inp" id="mn" placeholder="Твоё имя..." maxlength="15">
    <button class="btn-r" onclick="initRoom(true)">СОЗДАТЬ КОМНАТУ</button>
    <div style="height:10px"></div>
    <div style="display:flex; gap:10px;">
      <input class="fl-inp" id="jr-code" placeholder="Код" style="margin:0; text-transform:uppercase;">
      <button class="btn-r" style="width:120px" onclick="initRoom(false)">ВХОД</button>
    </div>
  </div>
</div>

<div id="s-app">
  <div class="pcol">
    <div id="vm">
        <div style="color:var(--tx3); font-weight:700;">ОЖИДАНИЕ ВИДЕО...</div>
    </div>
    <div id="ptop" class="glass">
      <div class="pp-pill">📍 <span id="room-id">...</span></div>
      <div id="url-wrap">
        <input type="text" id="v-url" placeholder="Ссылка на VK или YouTube">
        <button onclick="changeVideo()" class="btn-r" style="padding:6px 15px; width:auto; font-size:11px;">OK</button>
      </div>
    </div>
  </div>
  
  <div class="ccol glass">
    <div id="cmsg"></div>
    <div id="cinp-row" class="glass">
      <textarea id="msg-inp" placeholder="Сообщение..."></textarea>
      <button onclick="sendMsg()" class="btn-r" style="width:50px; padding:0;">⏎</button>
    </div>
  </div>
</div>

<script>
let curCode = '', isHost = false, wsOK = false, myName = '';
const WS_URL = location.origin.replace(/^http/, 'ws').replace('3000', '8080'); // Авто-подстройка под порт

const $ = id => document.getElementById(id);

function initRoom(host) {
  const n = $('mn').value.trim();
  if(!n) return alert('Введи имя');
  myName = n; isHost = host;
  curCode = host ? Math.random().toString(36).substr(2,6).toUpperCase() : $('jr-code').value.toUpperCase();
  
  if(!host && !curCode) return alert('Введи код');
  
  $('s-menu').style.display='none';
  $('s-app').classList.add('on');
  $('room-id').textContent = curCode;
  if(isHost) $('url-wrap').style.display = 'flex';
  
  connect();
}

function connect() {
  const ws = new WebSocket(WS_URL);
  
  ws.onopen = () => {
    wsOK = true;
    send({type:'join', code:curCode, name:myName, isHost});
    // Если гость — просим у сервера актуальное видео
    if(!isHost) send({type:'request-video', code:curCode});
  };

  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if(m.type === 'chat') addChat(m.name, m.text);
    if(m.type === 'video') loadVideo(m.url);
    
    // Ответ хоста на запрос видео от гостя
    if(m.type === 'request-video' && isHost) {
      const currentUrl = $('v-url').value;
      if(currentUrl) send({type:'video', url:currentUrl, code:curCode});
    }
  };

  ws.onclose = () => { wsOK = false; setTimeout(connect, 2000); };
  window._ws = ws;
}

function send(o) { if(wsOK) window._ws.send(JSON.stringify(o)); }

function changeVideo() {
  const u = $('v-url').value.trim();
  if(u) {
    send({type:'video', url:u, code:curCode});
    loadVideo(u);
  }
}

function loadVideo(u) {
  const vm = $('vm');
  if(!u) return;

  if(u.includes('youtube.com') || u.includes('youtu.be')) {
    let id = u.match(/(?:v=|be\/|embed\/)([^&?\s]+)/)?.[1];
    vm.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allow="autoplay;fullscreen"></iframe>`;
  } 
  else if(u.includes('vk.com/video') || u.includes('vkvideo.ru')) {
    let m = u.match(/video(-?[0-9]+_[0-9]+)/);
    if(m) {
      let p = m[1].split('_');
      vm.innerHTML = `<iframe src="https://vk.com/video_ext.php?oid=${p[0]}&id=${p[1]}&hash=0" allow="autoplay;fullscreen"></iframe>`;
    }
  } 
  else {
    vm.innerHTML = `<video controls autoplay style="width:100%;height:100%"><source src="${u}" type="video/mp4"></video>`;
  }
}

function sendMsg() {
  const t = $('msg-inp').value.trim();
  if(t) {
    send({type:'chat', text:t, name:myName, code:curCode});
    $('msg-inp').value = '';
  }
}

function addChat(n, t) {
  const d = document.createElement('div');
  d.className = 'msg';
  d.innerHTML = `<b style="color:var(--red)">${n}:</b> <span>${t}</span>`;
  $('cmsg').appendChild(d);
  $('cmsg').scrollTop = $('cmsg').scrollHeight;
}

// Отправка по Enter
$('msg-inp').onkeydown = e => { if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } };
</script>

</body>
</html>
