<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>QVORSTREAM - Glass Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --red:#e8183a; --ra:rgba(232,24,58,.13); --rb:rgba(232,24,58,.35);
  --bg:#09090c; --s1:#111116; --s2:#18181e; --s3:#20202a;
  --bd:rgba(255,255,255,.1); --bd2:rgba(255,255,255,.15);
  --tx:#f0f0f5; --tx2:#888898; --tx3:#4e4e62;
  --fn:'Nunito',sans-serif; --fd:'Bebas Neue',sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--fn);overflow:hidden;width:100%}
button,input,textarea{font-family:var(--fn);border:none;outline:none;background:none}

/* --- ЭФФЕКТ ПОЛУСТЭКЛА (GLASSMORPHISM) --- */
.glass {
  background: rgba(255, 255, 255, 0.03);
  backdrop-filter: blur(10px) brightness(1.1);
  -webkit-backdrop-filter: blur(10px) brightness(1.1); /* Для Safari */
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
}

/* Экраны */
#s-menu{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;padding:16px; background: var(--bg);}
#s-app{position:fixed;inset:0;z-index:100;display:none;}
#s-app.on{display:flex;}

/* Меню */
.menu-card{width:100%;max-width:400px;background:var(--s1);border:1px solid var(--bd2);border-radius:22px;padding:26px;display:flex;flex-direction:column;gap:18px;}
.hero h1{font-family:var(--fd);font-size:2.4rem;letter-spacing:.1em;color: var(--tx);}
.hero p{font-size:12px;color:var(--tx3);margin-top:3px;letter-spacing:.05em}
.fl-inp{background:var(--s3);border:1px solid var(--bd2);border-radius:11px;color:var(--tx);padding:13px;font-size:14px;width:100%;}
.btn-r{padding:13px;border-radius:11px;background:linear-gradient(135deg,#ff2a4a,#bf0f2d);color:#fff;font-size:13px;font-weight:800;cursor:pointer;text-align:center;width:100%;}

/* Layout Приложения */
#s-app.on{flex-direction:row}
.pcol{position:relative;flex:1;background:#000;display:flex;flex-direction:column;overflow:hidden;}
.ccol{width:320px;flex-shrink:0;display:flex;flex-direction:column;background:var(--s1);border-left:1px solid var(--bd)}

/* Плеер */
#pw{flex:1;position:relative;overflow:hidden}
#vm{position:absolute;inset:0}
#vm iframe,#vm video{width:100%;height:100%;border:none;display:block}

/* Топ-панель (Стекло) */
#ptop{position:absolute;top:10px;left:10px;right:10px;z-index:20;padding:8px 12px;display:flex;align-items:center;gap:8px;border-radius:16px; pointer-events:none;}
#ptop > * { pointer-events: all; }
.pp-pill{border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;color:#fff; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);}
.pp-host{background:rgba(232,24,58,0.3);border:1px solid var(--red);color:#fff;display:none}
.pp-host.on{display:block}

/* Ввод URL для хоста (Стекло) */
.url-box{display:none;align-items:center;gap:5px;padding:4px;border-radius:12px;}
.url-box input{font-size:11px;color:#fff;width:180px;padding:4px 8px;background: rgba(255,255,255,0.05); border-radius: 8px;}

/* Чат (Полу стекло) */
#ccnt{flex:1;display:flex;flex-direction:column;min-height:0;}
#cmsg{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;}
.msg-item { background: rgba(255,255,255,0.03); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); }

/* Ввод сообщения (Стекло) */
#cinp-row{display:flex;gap:8px;padding:12px;background:var(--s2);border-top:1px solid var(--bd)}
#msg-inp{flex:1;background:var(--s3);border:1px solid var(--bd);border-radius:10px;padding:10px;color:var(--tx);font-size:13px;height:40px;resize:none;overflow:hidden;}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;background:var(--s2);border:1px solid var(--bd2);border-radius:10px;padding:10px 16px;font-size:12px;opacity:0;transition:opacity 0.3s;}
#toast.show{opacity:1}

@media(max-width:700px){
  #s-app.on{flex-direction:column}
  .pcol{height:40%;flex:none}
  .ccol{width:100%;flex:1; border-left: none; border-top: 1px solid var(--bd);}
}
</style>
</head>
<body>

<div id="s-menu">
  <div class="menu-card">
    <div class="hero"><h1>QVORSTREAM</h1><p>СОВМЕСТНЫЙ ПРОСМОТР</p></div>
    <div class="fl">
      <input class="fl-inp" id="mn" placeholder="Ваше имя..." maxlength="20">
    </div>
    <div id="menu-main">
      <button class="btn-r" onclick="initRoom(true)" style="margin-bottom:10px">СОЗДАТЬ КОМНАТУ</button>
      <div style="display:flex; gap:5px;">
        <input class="fl-inp" id="jr-code" placeholder="Код..." maxlength="6" style="text-transform:uppercase; width: 100px;">
        <button class="btn-r" onclick="initRoom(false)">ВОЙТИ</button>
      </div>
    </div>
  </div>
</div>

<div id="s-app">
  <div class="pcol">
    <div id="pw">
      <div id="vm"></div>
      
      <div id="ptop" class="glass">
        <div class="pp-pill">📍 <span id="room-code">...</span></div>
        <div class="pp-pill pp-host" id="host-badge">🔴 ХОСТ</div>
        
        <div class="url-box glass" id="url-input-wrap">
          <input type="text" id="v-url" placeholder="Ссылка VK или YouTube...">
          <button onclick="changeVideo()" class="btn-r" style="padding:4px 12px; width: auto; font-size:10px">OK</button>
        </div>
        
        <div style="flex:1"></div>
        <div class="pp-pill">1 зритель</div>
      </div>
    </div>
  </div>
  
  <div class="ccol glass">
    <div id="ccnt">
      <div id="cmsg">
        </div>
      
      <div id="cinp-row" class="glass">
        <textarea id="msg-inp" placeholder="Сообщение..."></textarea>
        <button onclick="sendMsg()" class="btn-r" style="width: auto; padding: 0 20px;">⏎</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
let user = { name: 'Аноним' };
let curCode = '', isHost = false, wsOK = false;

// АДРЕС ТВOЕГО СЕРВЕРА (localhost для теста)
const WS_URL = 'ws://localhost:8080'; 

function $(id) { return document.getElementById(id); }
function toast(m) { $('toast').textContent = m; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'), 3000); }

function initRoom(host) {
  const nm = $('mn').value.trim();
  if(!nm) return toast('Введите имя');
  user.name = nm;
  isHost = host;
  curCode = host ? Math.random().toString(36).substr(2,6).toUpperCase() : $('jr-code').value.toUpperCase();
  
  if(!host && curCode.length < 6) return toast('Введите код');

  $('s-menu').style.display = 'none';
  $('s-app').classList.add('on');
  $('room-code').textContent = curCode;
  
  if(isHost) {
      $('host-badge').classList.add('on');
      $('url-input-wrap').style.display = 'flex';
  }
  
  connectWS();
}

// ЛОГИКА WEBSOCKET
function connectWS() {
  const ws = new WebSocket(WS_URL);
  
  ws.onopen = () => { 
      wsOK = true; 
      // Шаг 1: Авторизуемся на сервере
      send({type:'join', code:curCode, name:user.name}); 
      toast('Подключено к серверу');
  };
  
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    
    // Шаг 2: Обрабатываем входящие сообщения от сервера
    if(msg.type === 'chat') {
        addChat(msg.name, msg.text);
    }
    if(msg.type === 'video') {
        loadVideo(msg.url);
    }
  };
  
  ws.onerror = () => toast('Ошибка сервера. Запусти server.js!');
  ws.onclose = () => { wsOK = false; toast('Потеряно соединение'); };
  
  window._ws = ws; // Сохраняем глобально для отправки
}

function send(obj) { if(wsOK) window._ws.send(JSON.stringify(obj)); }

// УПРАВЛЕНИЕ ВИДЕО
function changeVideo() {
  const url = $('v-url').value.trim();
  if(url && isHost) {
    // Отправляем всем, включая себя (сервер перешлет)
    send({type:'video', url: url});
  }
}

function loadVideo(url) {
  const vm = $('vm');
  vm.innerHTML = ''; // Очищаем плеер
  
  // YouTube
  if (url.includes('youtube.com') || url.includes('youtu.be')) {
    let vid = url.match(/(?:v=|be\/|embed\/)([^&?\s]+)/)?.[1];
    if(vid) vm.innerHTML = `<iframe src="https://www.youtube.com/embed/${vid}?autoplay=1" allow="autoplay;fullscreen"></iframe>`;
  } 
  // VK Video
  else if (url.includes('vk.com/video') || url.includes('vkvideo.ru')) {
    let match = url.match(/video(-?[0-9]+_[0-9]+)/);
    if (match) {
      let parts = match[1].split('_');
      vm.innerHTML = `<iframe src="https://vk.com/video_ext.php?oid=${parts[0]}&id=${parts[1]}&hash=0" allow="autoplay;fullscreen"></iframe>`;
    }
  } 
  // Прямая ссылка MP4
  else if (url.endsWith('.mp4')) {
    vm.innerHTML = `<video controls autoplay style="width:100%; height:100%"><source src="${url}" type="video/mp4"></video>`;
  } else {
      toast('Неподдерживаемая ссылка');
  }
}

// ЛОГИКА ЧАТА
function sendMsg() {
  const t = $('msg-inp').value.trim();
  if(t && wsOK) { 
      // Отправляем сообщение на сервер
      send({type:'chat', text:t, name:user.name}); 
      $('msg-inp').value = ''; // Очищаем ввод
  }
}

function addChat(n, t) {
  const d = document.createElement('div');
  d.className = 'msg-item';
  // Подсвечиваем свои сообщения
  const nameColor = (n === user.name) ? 'var(--green)' : 'var(--red)';
  d.innerHTML = `<b style="font-size:12px; color:${nameColor}">${n}:</b> <span style="font-size:13px; color:var(--tx)">${t}</span>`;
  $('cmsg').appendChild(d);
  // Авто-скролл вниз
  $('cmsg').scrollTop = $('cmsg').scrollHeight;
}

// Отправка по Enter
$('msg-inp').addEventListener('keypress', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
    }
});
</script>
</body>
</html>
