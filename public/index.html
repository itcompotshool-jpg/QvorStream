<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUORVOX | MOBILE FIX</title>
    <script src="https://vk.com/js/api/videoplayer.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root { --accent: #ff0055; --bg: #050505; --panel: #0a0a0a; --glass: rgba(255, 255, 255, 0.05); }
        * { box-sizing: border-box; margin: 0; padding: 0; outline: none; }
        
        /* Фиксируем body, чтобы избежать "резинового" скролла на iOS */
        body, html { 
            height: 100dvh; 
            background: var(--bg); 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
            position: fixed;
            width: 100%;
        }

        /* МЕНЮ */
        #main-menu { position: fixed; inset: 0; z-index: 2000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .logo { font-family: 'Syncopate'; color: var(--accent); font-size: 3rem; margin-bottom: 30px; letter-spacing: 5px; }

        /* ЭКРАН ПРИЛОЖЕНИЯ */
        #app-screen { 
            display: none; 
            height: 100dvh; 
            flex-direction: row; 
        }

        /* ПЛЕЕР */
        .player-side { 
            position: relative; 
            flex: 1; 
            background: #000; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
        }
        #vk-player-mount { width: 100%; height: 100%; }

        /* ЧАТ-КОНТЕЙНЕР */
        .chat-side { 
            width: 350px; 
            background: var(--panel); 
            display: flex; 
            flex-direction: column; 
            border-left: 1px solid var(--glass);
            height: 100%;
        }

        /* АДАПТИВ ПОД МОБИЛКИ */
        @media (max-width: 900px) {
            #app-screen { flex-direction: column; }
            .player-side { 
                height: 35vh; /* Плеер занимает 35% высоты и не двигается */
                min-height: 220px;
                flex: none; 
            }
            .chat-side { 
                width: 100%; 
                flex: 1; /* ЧАТ занимает всё оставшееся место */
                height: 65vh; 
                overflow: hidden;
            }
        }

        /* ПУЛЬТ */
        #toggle-remote-btn { 
            position: absolute; top: 10px; left: 10px; z-index: 1000; 
            background: var(--accent); border: none; color: white; 
            padding: 8px 15px; border-radius: 8px; font-weight: bold; font-size: 11px; cursor: pointer;
        }
        .remote-panel { 
            position: absolute; top: 50px; left: 10px; width: 280px;
            background: rgba(0,0,0,0.95); border: 1px solid var(--accent); 
            padding: 15px; border-radius: 15px; display: none; z-index: 1001;
        }
        .remote-panel.active { display: block; }
        .btn-s { background: #222; border: none; color: white; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 11px; font-weight: bold; }

        /* ШАПКА ЧАТА */
        .chat-header { 
            padding: 15px; 
            background: #000; 
            border-bottom: 1px solid var(--glass);
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            flex-shrink: 0; /* Чтобы не сжималась */
        }
        .room-badge { color: var(--accent); font-family: 'Syncopate'; font-size: 12px; letter-spacing: 2px; }

        /* САМИ СООБЩЕНИЯ - ЕДИНСТВЕННАЯ ЗОНА СО СКРОЛЛОМ */
        #chat-msgs { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px;
            -webkit-overflow-scrolling: touch; 
        }

        .msg { background: var(--glass); padding: 10px 15px; border-radius: 15px; font-size: 13px; max-width: 85%; position: relative; cursor: pointer; align-self: flex-start; }
        .msg-header { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; color: var(--accent); font-weight: bold; font-size: 10px; }
        .msg-ava { width: 20px; height: 20px; border-radius: 50%; }

        .react-badge { position: absolute; bottom: -8px; right: -5px; background: #1a1a1a; border: 1px solid var(--accent); border-radius: 10px; padding: 1px 5px; font-size: 11px; }

        #emoji-picker { position: fixed; display: none; background: #1a1a1a; padding: 10px; border-radius: 20px; border: 1px solid var(--accent); gap: 10px; z-index: 3000; }
        .emo-btn { font-size: 20px; cursor: pointer; transition: 0.2s; }

        /* ВВОД - ВСЕГДА ПРИЖАТ К НИЗУ */
        .input-bar { 
            padding: 12px; 
            background: #000; 
            display: flex; 
            gap: 8px; 
            border-top: 1px solid var(--glass);
            flex-shrink: 0; 
            padding-bottom: calc(12px + env(safe-area-inset-bottom)); /* Учет челок/полосок снизу */
        }
        .input-bar input { flex: 1; background: #151515; border: 1px solid #333; color: white; padding: 12px 15px; border-radius: 25px; font-size: 16px; /* 16px предотвращает зум на iOS */ }
        .send-btn { background: white; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    </style>
</head>
<body>

    <div id="main-menu">
        <div class="logo">QUORVOX</div>
        <button class="btn-s" style="padding:15px 40px; background:var(--accent); color:white" onclick="appAction('create')">СОЗДАТЬ</button>
        <button class="btn-s" style="padding:15px 40px; margin-top:10px; color:white" onclick="appAction('join')">ВОЙТИ</button>
    </div>

    <div id="app-screen">
        <div class="player-side">
            <button id="toggle-remote-btn" style="display:none;" onclick="document.getElementById('remote-p').classList.toggle('active')">🎮 ПУЛЬТ</button>
            
            <div class="remote-panel" id="remote-p">
                <input type="text" id="v-url" placeholder="Ссылка на VK..." style="width:100%; padding:10px; background:#000; border:1px solid #333; color:white; border-radius:8px; margin-bottom:10px;">
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:5px;">
                    <button class="btn-s" onclick="sync('play')">PLAY</button>
                    <button class="btn-s" onclick="sync('pause')">PAUSE</button>
                    <button class="btn-s" onclick="seek(-10)">-10 СЕК</button>
                    <button class="btn-s" onclick="seek(10)">+10 СЕК</button>
                    <button class="btn-s" style="grid-column: span 2; background:var(--accent); color:white" onclick="loadVideo()">ЗАГРУЗИТЬ</button>
                </div>
            </div>
            <div id="vk-player-mount"></div>
        </div>

        <div class="chat-side">
            <div class="chat-header">
                <div class="room-badge" id="room-id-display">#----</div>
                <div onclick="alert('Настройки профиля')" style="cursor:pointer">⚙️</div>
            </div>
            <div id="chat-msgs"></div>
            <div class="input-bar">
                <input type="text" id="m-val" placeholder="Написать..." onkeypress="if(event.keyCode==13) sendMsg()">
                <button class="send-btn" onclick="sendMsg()">
                    <svg viewBox="0 0 24 24" width="20" fill="black"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <div id="emoji-picker">
        <span class="emo-btn" onclick="react('👍')">👍</span>
        <span class="emo-btn" onclick="react('❤️')">❤️</span>
        <span class="emo-btn" onclick="react('🔥')">🔥</span>
        <span class="emo-btn" onclick="react('😂')">😂</span>
    </div>

    <script>
        let ws, isHost = false, player = null, selMsgId = null;
        const user = { name: 'User' + Math.floor(Math.random()*99), ava: 'https://i.pravatar.cc/100' };

        function appAction(mode) {
            ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
            ws.onopen = () => {
                if(mode === 'create') ws.send(JSON.stringify({type:'create'}));
                else { const c = prompt("Код:"); if(c) ws.send(JSON.stringify({type:'join', code:c})); }
            };
            ws.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if(d.type === 'room_created' || d.type === 'joined') {
                    document.getElementById('main-menu').style.display = 'none';
                    document.getElementById('app-screen').style.display = 'flex';
                    document.getElementById('room-id-display').innerText = "#" + d.code;
                    if(d.type === 'room_created') {
                        isHost = true;
                        document.getElementById('toggle-remote-btn').style.display = 'block';
                    }
                    if(d.videoUrl) initPlayer(d.videoUrl);
                }
                if(d.type === 'load_video') initPlayer(d.url);
                if(player) {
                    if(d.type === 'play') player.play();
                    if(d.type === 'pause') player.pause();
                    if(d.type === 'seek_step') player.seek(player.getCurrentTime() + d.step);
                }
                if(d.type === 'chat') renderMsg(d);
                if(d.type === 'reaction') {
                    const m = document.querySelector(`[data-id="${d.msgId}"] .react-badge`);
                    if(m) m.innerHTML = d.emoji;
                }
            };
        }

        function initPlayer(u) {
            const mount = document.getElementById('vk-player-mount');
            mount.innerHTML = `<iframe id="vk-ifr" src="${u}${u.includes('?')?'&':'?'}js_api=1" style="width:100%;height:100%;border:none;" allow="autoplay;fullscreen"></iframe>`;
            setTimeout(() => { player = VK.VideoPlayer(document.getElementById('vk-ifr')); }, 600);
        }

        function loadVideo() {
            let val = document.getElementById('v-url').value;
            if(val.includes('<iframe')) {
                let match = val.match(/src="([^"]+)"/);
                if(match) val = match[1];
            }
            ws.send(JSON.stringify({type:'load_video', url: val}));
            document.getElementById('remote-p').classList.remove('active');
        }

        function sync(a) { if(isHost) ws.send(JSON.stringify({type: a})); }
        function seek(s) { if(isHost) ws.send(JSON.stringify({type:'seek_step', step: s})); }

        function sendMsg() {
            const i = document.getElementById('m-val');
            if(i.value) {
                ws.send(JSON.stringify({type:'chat', text:i.value, sender:user.name, ava:user.ava, msgId:Date.now()}));
                i.value = '';
            }
        }

        function renderMsg(d) {
            const b = document.getElementById('chat-msgs');
            const div = document.createElement('div');
            div.className = 'msg'; div.setAttribute('data-id', d.msgId);
            div.innerHTML = `<div class="msg-header"><img src="${d.ava}" class="msg-ava"> ${d.sender}</div>${d.text}<div class="react-badge"></div>`;
            div.onclick = (e) => {
                selMsgId = d.msgId;
                const p = document.getElementById('emoji-picker');
                p.style.display = 'flex'; p.style.top = (e.clientY - 40) + 'px'; p.style.left = (e.clientX) + 'px';
            };
            b.appendChild(div);
            b.scrollTop = b.scrollHeight; // Автопрокрутка вниз при новом сообщении
        }

        function react(emo) {
            ws.send(JSON.stringify({type:'reaction', msgId:selMsgId, emoji:emo}));
            document.getElementById('emoji-picker').style.display = 'none';
        }

        window.onclick = (e) => { if(!e.target.closest('.msg')) document.getElementById('emoji-picker').style.display='none'; }
    </script>
</body>
</html>
